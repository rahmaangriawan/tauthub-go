# Nginx reverse proxy Tauthub staging (REWRITE/02_FRONTEND_SVELTE.md §9).
# web :3000 untuk semua path; /v1, /uploads, /t, /feed, /healthz -> api :8080.
# Dipasang oleh deploy/setup-vps.sh. Port 443 wajib: Cloudflare SSL mode
# "Full" selalu menyambung origin via HTTPS — tanpa listener 443 muncul
# error 521. Sertifikat: Let's Encrypt bila sudah diterbitkan certbot,
# kalau belum self-signed (CF Full non-strict tetap melayani).
# Setelah DNS stabil, terbitkan asli: certbot --nginx -d staging.tauthub.com

upstream tauthub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream tauthub_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # Security headers (defense-in-depth; API Go mengirim header serupa lewat
    # internal/httpx/security_headers.go). CSP penuh sengaja belum dipasang —
    # berisiko memutus UI; naikkan bertahap di laporan audit.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API Go
    location ~ ^/(v1|uploads|t|feed|healthz)(/|$) {
        proxy_pass http://tauthub_api;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Aset immutable SvelteKit
    location /_app/immutable/ {
        proxy_pass http://tauthub_web;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Web SvelteKit
    location / {
        proxy_pass http://tauthub_web;
        proxy_http_version 1.1;
        # Header respons halaman terautentikasi bisa > 4KB (default buffer
        # nginx) — tanpa buffer lebih besar nginx menjawab 502 dengan error
        # "upstream sent too big header".
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
