# Vhost data.tauthub.com — katalog media publik.
#
# Produksi Tauthub memakai CloudPanel, jadi berkas ini REFERENSI. Bila nginx
# dikelola manual, pasang (ganti __SSL_CERT__/__SSL_KEY__), lalu
# `nginx -t && systemctl reload nginx`.
#
# SENGAJA TANPA blok `upstream`: vhost aplikasi (app.tauthub.com) sudah punya
# `upstream tauthub_api`/`tauthub_web`. Kalau nama itu dideklarasikan lagi di
# sini, nginx menolak reload ("duplicate upstream") dan SEMUA situs ikut mati.
# Karena itu proxy_pass memakai alamat literal.
#
# Bila CloudPanel yang mengelola: cukup salin blok `location`-nya ke editor
# Vhost site data.tauthub.com; jangan menyalin bagian server/ssl.
#
# Yang WAJIB sama dengan vhost aplikasi:
#   - /_app/immutable/ di-proxy ke web dengan cache immutable
#   - /v1, /uploads, /t, /feed, /healthz di-proxy ke API Go
#   - Header Host diteruskan (SvelteKit memakai host untuk memilih situs publik)

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name data.tauthub.com;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Katalog baca-saja; tidak ada unggahan lewat host ini.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~ ^/(v1|uploads|t|feed|healthz)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
