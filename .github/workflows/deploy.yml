name: Deploy Staging (Go)

# Deploy otomatis Tauthub Go staging ke VPS (root@103.42.245.116) setiap
# push ke master. Binary Go dibangun di runner (linux/amd64), web SvelteKit
# dibangun di VPS (bun). Kode dikirim via rsync di atas SSH (password).
#
# Di VPS urutannya (deploy/setup-vps.sh lalu deploy/deploy.sh):
#   1. bootstrap idempoten: postgres, nginx, node 22, bun, user, .env (sekali),
#      DB tauthub_go + baseline schema-full.sql (jika DB kosong), systemd, TLS
#   2. migrate up (additive, toleran duplikat) -> build web -> restart service
#
# Secret (repo > Settings > Secrets and variables > Actions):
#   SSH_HOST       host staging (VPS lama: 103.42.245.116 / host v2: 43.156.237.97)
#   SSH_USER       root (VPS lama) / ubuntu (host v2 CloudPanel)
#   SSH_PASSWORD   password user SSH
#   VPS_APP_DIR    (opsional) default /opt/tauthub/app
#
# Variabel repo (Settings > Variables) — isi begini kalau staging pindah ke host
# v2 (CloudPanel) yang sudah menjalankan production tauthub-*:
#   STAGING_APP_USER     tauthub-staging
#   STAGING_UNIT_PREFIX  tauthub-staging  (unit production tauthub-* tidak disentuh)
#   STAGING_WEB_PORT     3000             (production memakai 3001)
#   STAGING_SKIP_APT     1                (jangan sentuh paket/nginx CloudPanel)
#   STAGING_MANAGE_NGINX 0                (vhost & TLS staging dikelola CloudPanel)
#   STAGING_MANAGE_SWAP  0                (host v2 sudah punya swap)
# Tanpa variabel di atas, perilaku lama (host polos, unit tauthub-*) tetap jalan.
#
# Domain: staging.tauthub.com (A record -> host staging).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging-go
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build linux binaries (api, scheduler, worker, migrate)
        working-directory: api
        run: |
          for cmd in api scheduler worker migrate; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o "bin/$cmd" "./cmd/$cmd"
          done

      - name: Install sshpass + rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Sync + bootstrap + deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          STAGING_APP_USER: ${{ vars.STAGING_APP_USER || 'tauthub' }}
          STAGING_UNIT_PREFIX: ${{ vars.STAGING_UNIT_PREFIX || 'tauthub' }}
          STAGING_WEB_PORT: ${{ vars.STAGING_WEB_PORT || '3000' }}
          STAGING_SKIP_APT: ${{ vars.STAGING_SKIP_APT || '0' }}
          STAGING_MANAGE_NGINX: ${{ vars.STAGING_MANAGE_NGINX || '1' }}
          STAGING_MANAGE_SWAP: ${{ vars.STAGING_MANAGE_SWAP || '1' }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Secret SSH_HOST belum di-set}"
          : "${SSH_USER:?Secret SSH_USER belum di-set}"
          : "${SSH_PASSWORD:?Secret SSH_PASSWORD belum di-set}"
          APP_DIR="${VPS_APP_DIR:-/opt/tauthub/app}"
          export SSHPASS="$SSH_PASSWORD"
          mkdir -p ~/.ssh
          # Keepalive: build web di VPS bisa diam beberapa menit, koneksi idle
          # sering diputus NAT/firewall (broken pipe). ConnectTimeout supaya
          # host mati gagal cepat, bukan menggantung 2 menit.
          SSH_OPTS="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=12"

          # SSH/rsync kadang macet saat handshake (box 2GB sedang sibuk build) —
          # "Timeout, server not responding". Semua langkah diulang sampai 4x;
          # setup-vps.sh idempoten dan deploy.sh migrasinya additive, jadi aman.
          retry() {
            for i in 1 2 3 4; do
              if "$@"; then return 0; fi
              echo "percobaan $i gagal — mengulang dalam 15 detik..." >&2
              sleep 15
            done
            echo "gagal setelah 4 percobaan" >&2
            return 1
          }

          # Sinkronkan kode + binary. .env / .data / hasil build dipertahankan
          # di VPS (exclude juga melindungi dari --delete). public/uploads di
          # dua sisi adalah lokasi unggahan lama — jangan sampai terhapus.
          # apps/ + sisa struktur repo lama juga dilindungi: direktori tujuan
          # dipakai bersama deploy lama, dan --delete sempat menghabiskan waktu
          # mencoba menghapusnya ("cannot delete non-empty directory: apps/web")
          # sampai koneksi SSH timeout. --timeout membatasi I/O macet.
          retry rsync -rltDz --delete --timeout=120 \
            -e "sshpass -e ssh $SSH_OPTS" \
            --exclude='.git/' --exclude='node_modules/' --exclude='.svelte-kit/' \
            --exclude='.data/' --exclude='.env' --exclude='.env.*' \
            --exclude='web/build/' --exclude='api/api' --exclude='.DS_Store' \
            --exclude='tmp_*' --exclude='*.log' \
            --exclude='web/public/uploads/' --exclude='api/public/uploads/' \
            --exclude='apps/' --exclude='packages/' --exclude='.next/' \
            --exclude='context-graph-engine/' --exclude='REWRITE/' \
            --exclude='turbo.json' --exclude='pnpm-lock.yaml' --exclude='pnpm-workspace.yaml' \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

          # Seed gambar unggahan yang di-commit (api/.data/uploads, lihat
          # .gitignore) ke VPS: --ignore-existing tanpa --delete supaya hanya
          # menambah berkas yang hilang dan tidak pernah menimpa/menghapus
          # gambar hasil generate runtime di VPS.
          retry rsync -rltDz --ignore-existing --timeout=120 \
            -e "sshpass -e ssh $SSH_OPTS" \
            api/.data/uploads/ "$SSH_USER@$SSH_HOST:$APP_DIR/api/.data/uploads/"

          # Bootstrap idempoten (paket, .env, DB, nginx, systemd, TLS).
          retry sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' DOMAIN=staging.tauthub.com APP_USER='$STAGING_APP_USER' UNIT_PREFIX='$STAGING_UNIT_PREFIX' WEB_PORT='$STAGING_WEB_PORT' SKIP_APT='$STAGING_SKIP_APT' MANAGE_NGINX='$STAGING_MANAGE_NGINX' MANAGE_SWAP='$STAGING_MANAGE_SWAP' bash '$APP_DIR/deploy/setup-vps.sh'"

          # Migrasi + build web + restart + health check.
          retry sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' APP_USER='$STAGING_APP_USER' UNIT_PREFIX='$STAGING_UNIT_PREFIX' WEB_PORT='$STAGING_WEB_PORT' bash '$APP_DIR/deploy/deploy.sh'"
